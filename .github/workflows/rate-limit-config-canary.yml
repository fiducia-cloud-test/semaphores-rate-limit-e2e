name: rate-limit config canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out exact rate-limit interface authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-rate-limit/ores-rl-interfaces
          ref: 241353d0f5269450690d9646be03db2aba59a2ae
          path: canary/deps/ores-rl-interfaces
          token: ${{ secrets.TEST_FLEET_READ_TOKEN || github.token }}
          persist-credentials: false
          show-progress: false

      - name: Check out exact strict runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-rate-limit/ores-rl-lib-core
          ref: fb68221b0c267f88bf878bb733c9854bf832073e
          path: canary/deps/ores-rl-lib-core
          token: ${{ secrets.TEST_FLEET_READ_TOKEN || github.token }}
          persist-credentials: false
          show-progress: false

      - name: Check out exact Fiducia client consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fiducia-cloud/fiducia-clients
          ref: 856f40c992d8da0b55ed6932022e901cddd13307
          path: canary/consumers/fiducia-clients
          persist-credentials: false
          show-progress: false

      - name: Check out exact Opto same-root consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opto-sync/opto-sync-monorepo
          ref: fca2654a5bd9f6abadd3fb95e06b3d87d641df5a
          path: canary/consumers/opto-sync-monorepo
          persist-credentials: false
          show-progress: false

      - name: Verify immutable source pins
        run: |
          set -euo pipefail
          test "$(git -C canary/deps/ores-rl-interfaces rev-parse HEAD)" = 241353d0f5269450690d9646be03db2aba59a2ae
          test "$(git -C canary/deps/ores-rl-lib-core rev-parse HEAD)" = fb68221b0c267f88bf878bb733c9854bf832073e
          test "$(git -C canary/consumers/fiducia-clients rev-parse HEAD)" = 856f40c992d8da0b55ed6932022e901cddd13307
          test "$(git -C canary/consumers/opto-sync-monorepo rev-parse HEAD)" = fca2654a5bd9f6abadd3fb95e06b3d87d641df5a

      - name: Require complete config declaration mapping
        run: |
          jq -e '
            .schema == "ores.typespec-json-schema-validator.mapping/v1" and
            (.declarations | length) == 13 and
            .ignore.typespec == [] and
            .ignore.generated == [] and
            .ignore.authored == []
          ' canary/deps/ores-rl-interfaces/tjsv/rate-limit-config.v1.mapping.json

      - name: TJSV peer-authority admission
        uses: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc
        with:
          typespec: canary/deps/ores-rl-interfaces/typespec/rate-limit-config.v1.tsp
          schema: canary/deps/ores-rl-interfaces/json-schema/rate-limit-config.v1.schema.json
          mapping: canary/deps/ores-rl-interfaces/tjsv/rate-limit-config.v1.mapping.json
          report: .canary-evidence/tjsv/report.json
          sarif: .canary-evidence/tjsv/report.sarif
          contract_ir: .canary-evidence/tjsv/contract-ir.json
          output_dir: .canary-evidence/tjsv/generated
          int64_strategy: number
          quiet: "false"

      - name: Require TJSV pass and non-authoritative IR
        run: |
          set -euo pipefail
          jq -e '.status == "passed" and .zeroUnexplainedFindings == true and .authorities.precedence == "none"' .canary-evidence/tjsv/report.json
          jq -e '.status == "passed" and .admissible == true and .editableAuthority == false' .canary-evidence/tjsv/contract-ir.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Re-run canonical strict TOML runtime suite
        run: cargo test --manifest-path canary/deps/ores-rl-lib-core/Cargo.toml --features config-toml --test config_toml

      - name: Run real-consumer and adversarial canary cases
        run: cargo test --manifest-path canary/rate-limit-consumer/Cargo.toml

      - name: Prove test did not rewrite source contracts or consumers
        run: |
          git -C canary/deps/ores-rl-interfaces diff --exit-code
          git -C canary/deps/ores-rl-lib-core diff --exit-code
          git -C canary/consumers/fiducia-clients diff --exit-code
          git -C canary/consumers/opto-sync-monorepo diff --exit-code

      - name: Retain canary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rate-limit-config-canary-${{ github.event.pull_request.head.sha || github.sha }}
          path: .canary-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
