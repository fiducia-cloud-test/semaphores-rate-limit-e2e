name: ores-cli rate-limit evidence corpus

on:
  pull_request:
    paths:
      - 'fixtures/ores-cli-rate-limit/**'
      - 'scripts/validate-ores-cli-rate-limit-evidence.mjs'
      - '.github/workflows/ores-cli-rate-limit-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/ores-cli-rate-limit/**'
      - 'scripts/validate-ores-cli-rate-limit-evidence.mjs'
      - '.github/workflows/ores-cli-rate-limit-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-rate-limit-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixture-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Validate external ores-cli rate-limit evidence corpus
        run: node scripts/validate-ores-cli-rate-limit-evidence.mjs
      - name: Prove fixtures are secret-free and source-only
        run: git diff --exit-code
